directories:
  output: release
  buildResources: build
appId: com.musicvideogenerator.app
productName: Music Video Generator
files:
  - filter:
      - dist/**/*
      - electron/**/*
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: public/favicon.svg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 33.4.11
